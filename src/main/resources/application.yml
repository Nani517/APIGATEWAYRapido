```yaml
spring:
  application:
    name: ola-spring-cloud-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: https://customerservice-1-atyl.onrender.com
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1

            - id: rider-service
              uri: https://riderservice-ry6k.onrender.com
              predicates:
                - Path=/rider/**

server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
```